          h('line', {x1: ml, x2: W - mr, y1: y(t), y2: y(t), style: {stroke: t === 0 ? 'var(--muted)' : 'var(--grid)'}, strokeWidth: 1}),
          h('text', {x: ml - 8, y: y(t) + 4, textAnchor: 'end'}, t.toLocaleString('en-US')))),
        M.map((m, i) => (m.m.slice(5,7) === '01' || i === 0) ? h('text', {key: m.m, x: x(i), y: H - 10, textAnchor: 'middle'}, mlabel(m.m)) : null),
        h('line', {x1: x(iB0), x2: x(iSplit), y1: y(before), y2: y(before), strokeDasharray: '5 4', strokeWidth: 1.5, style: {stroke: 'var(--muted)'}}),
        h('line', {x1: x(iSplit), x2: x(M.length-1), y1: y(after), y2: y(after), strokeDasharray: '5 4', strokeWidth: 1.5, style: {stroke: 'var(--bad)'}}),
        h('line', {x1: x(iCredit), x2: x(iCredit), y1: mt, y2: mt + ih, strokeWidth: 1.2, strokeDasharray: '2 3', style: {stroke: 'var(--bad)'}}),
        h('text', {x: x(iCredit) + 6, y: mt + 12, className: 'lbl', style: {fill: 'var(--bad)'}}, 'Sep 30, 2025: federal credit ended [R1]'),
        h('text', {x: x(M.length-1) - 4, y: mt + ih - 8, textAnchor: 'end', className: 'lbl'}, 'Aug–Oct 2026: all passenger cars fell too'),
        h('path', {d: path, fill: 'none', strokeWidth: 2.2, strokeLinejoin: 'round', style: {stroke: 'var(--fg)'}}),
        M.map((m, i) => h('circle', {key: m.m, cx: x(i), cy: y(m.v), r: hi === i ? 5 : 2.6, style: {fill: i > iSplit ? 'var(--bad)' : 'var(--fg)'}})),
        hi != null && h('line', {x1: x(hi), x2: x(hi), y1: mt, y2: mt + ih, style: {stroke: 'var(--muted)'}, strokeWidth: 1}),
        h('rect', {x: ml, y: mt, width: iw, height: ih, fill: 'transparent', onMouseMove: move, onMouseLeave: () => setHi(null), onTouchStart: e => move(e.touches[0] ? Object.assign({currentTarget: e.currentTarget}, {clientX: e.touches[0].clientX}) : e)})
      ),
      d && h(Tip, {x: x(hi), y: y(d.v), W, H},
        h('b', null, mlabel(d.m)), h('br'), 'BEVs added: ' + (d.v >= 0 ? '+' : '') + fmt(d.v), h('br'), 'All passenger cars: ' + (d.cars >= 0 ? '+' : '') + fmt(d.cars)))
  );
}

/* ---------- Scatter ---------- */
const FILTERS = [['All counties', null], ['7 growing', '7 growing'], ['5 largest', '5 largest'], ['Other', 'Other']];
function Scatter({sel, setSel}){
  const [f, setF] = useState(null), [hov, setHov] = useState(null);
  const W = 560, H = 380, ml = 46, mr = 14, mt = 16, mb = 42, iw = W - ml - mr, ih = H - mt - mb;
  const lo = Math.log10(2), hiL = Math.log10(12000);
  const x = v => ml + (Math.log10(v) - lo) / (hiL - lo) * iw, y = v => mt + (48 - v) / 48 * ih;
  const pts = C.filter(d => d.county !== 'Garfield');
  const show = d => !f || d.group === f;
  const order = [...pts].sort((a, b) => (show(a) - show(b)) || (a.group === 'Other' ? -1 : 1));
  const labelled = d => d.county === sel || d.county === 'King' || d.county === 'Benton' || (f && f !== 'Other' && d.group === f);
  const hd = hov && byName[hov];
  return h('section', {className: 'card', id: 'counties'},
    h('h2', null, 'BEVs added vs growth, by county'),
    h('p', {className: 'note'}, 'Dashed lines: county medians (' + fmt(medA) + ' BEVs, ' + medG.toFixed(1) + '%). Garfield left out.'),
    h('div', {className: 'controls', role: 'group', 'aria-label': 'Highlight a group'},
      FILTERS.map(([lab, v]) => h('button', {key: lab, className: 'chip', 'aria-pressed': f === v, onClick: () => setF(v)}, lab))),
    h('div', {className: 'chart'},
      h('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Scatter plot of BEVs added (log scale) against growth rate for 38 counties, with median lines; seven counties are above both medians.'},
        h('rect', {x: x(medA), y: mt, width: W - mr - x(medA), height: y(medG) - mt, style: {fill: 'var(--c7)', opacity: .07}}),
        [0, 10, 20, 30, 40].map(t => h('g', {key: 'y' + t},
          h('line', {x1: ml, x2: W - mr, y1: y(t), y2: y(t), style: {stroke: 'var(--grid)'}}),
          h('text', {x: ml - 8, y: y(t) + 4, textAnchor: 'end'}, t + '%'))),
        [10, 100, 1000, 10000].map(t => h('g', {key: 'x' + t},
          h('line', {x1: x(t), x2: x(t), y1: mt, y2: mt + ih, style: {stroke: 'var(--grid)'}}),
          h('text', {x: x(t), y: H - 22, textAnchor: 'middle'}, t.toLocaleString('en-US')))),
        h('text', {x: ml + iw / 2, y: H - 4, textAnchor: 'middle'}, 'BEVs added, Oct 2025 → Oct 2026 (log scale)'),
        h('line', {x1: x(medA), x2: x(medA), y1: mt, y2: mt + ih, strokeDasharray: '5 4', style: {stroke: 'var(--hl)'}}),
        h('line', {x1: ml, x2: W - mr, y1: y(medG), y2: y(medG), strokeDasharray: '5 4', style: {stroke: 'var(--hl)'}}),
        h('text', {x: W - mr - 4, y: mt + 12, textAnchor: 'end', className: 'lblb', style: {fill: 'var(--c7)'}}, 'Many and fast'),
        order.map(d => {
          const on = show(d), isSel = d.county === sel;
          return h('g', {key: d.county, className: 'pt', tabIndex: on ? 0 : -1, role: 'button', 'aria-label': `${d.county}: ${fmt(d.aa)} BEVs added, ${d.ga.toFixed(1)}% growth`,
              onMouseEnter: () => setHov(d.county), onMouseLeave: () => setHov(null), onFocus: () => setHov(d.county), onBlur: () => setHov(null),
              onClick: () => setSel(d.county), onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSel(d.county); } }},
            h('circle', {cx: x(d.aa), cy: y(d.ga), r: d.group === 'Other' ? 5 : 6.5, style: {fill: color(d.group), opacity: on ? 1 : .18, stroke: isSel ? 'var(--hl)' : 'var(--panel)'}, strokeWidth: isSel ? 2.5 : 1}),
            on && labelled(d) && h('text', {x: x(d.aa) + 9, y: y(d.ga) + 4, className: isSel ? 'lblb' : 'lbl'}, d.county));
        })
      ),
      hd && h(Tip, {x: x(hd.aa), y: y(hd.ga) - 6, W, H},
        h('b', null, hd.county), ' · ' + hd.region, h('br'), '+' + fmt(hd.aa) + ' BEVs · ' + hd.ga.toFixed(1) + '% growth', h('br'), 'Pace kept: ' + pct(hd.aa / hd.ab, 0))),
    h('div', {className: 'legend'},
      h('span', null, h('i', {style: {background: 'var(--c7)'}}), '7 growing counties: survey charging access'),
      h('span', null, h('i', {style: {background: 'var(--c5)'}}), '5 largest counties: review charger capacity'),
      h('span', null, h('i', {style: {background: 'var(--other)'}}), 'Other counties'))
  );
}

function Detail({name}){
  const d = byName[name];
  if (!d) return null;
  const items = [
    ['BEVs added', '+' + fmt(d.ab) + ' → +' + fmt(d.aa)],
    ['Growth', (d.gb == null ? 'n/a' : d.gb.toFixed(1) + '%') + ' → ' + d.ga.toFixed(1) + '%'],
    ['Pace kept', d.ab > 0 ? pct(d.aa / d.ab, 0) : 'n/a'],
    ['EV share, Oct 2025', d.ev.toFixed(2) + '%'],
    ['By 2030 at current pace', '+' + fmt(d.aa * 4)]
  ];
  return h('div', null,
    h('div', {className: 'detail', 'aria-live': 'polite'},
      h('div', {style: {gridColumn: '1 / -1'}}, h('b', null, d.county), h('span', {className: 'tag'}, d.group === 'Other' ? d.region : d.group + ' · ' + d.region)),
      items.map(([k, v]) => h('div', {key: k}, h('div', {className: 'lab'}, k), h('div', {className: 'v'}, v)))));
}

/* ---------- Ranking ---------- */
const METRICS = {
  growth: {lab: 'Growth (%)', get: d => d.ga, fmt: v => v.toFixed(1) + '%', ref: () => medG, refLab: 'median'},
  added:  {lab: 'BEVs added', get: d => d.aa, fmt: v => fmt(v), ref: () => medA, refLab: 'median'},
  pace:   {lab: 'Pace kept', get: d => d.aa / d.ab, fmt: v => pct(v, 0), ref: () => 1, refLab: 'same as before'}
};
function Ranking({sel, setSel}){
  const [k, setK] = useState('growth'); const m = METRICS[k];
  const rows = [...G7, ...G5].sort((a, b) => m.get(b) - m.get(a));
  const W = 520, rh = 25, mt = 22, ml = 92, mr = 64, H = mt + rows.length * rh + 6, iw = W - ml - mr;
  const max = Math.max(...rows.map(m.get), m.ref()) * 1.02;
  const x = v => ml + v / max * iw;
  return h('section', {className: 'card', id: 'ranking'},
    h('h2', null, 'Survey counties, ranked'),
    
    h('div', {className: 'controls', role: 'group', 'aria-label': 'Measure'},
      Object.entries(METRICS).map(([key, v]) => h('button', {key, className: 'chip', 'aria-pressed': k === key, onClick: () => setK(key)}, v.lab))),
    h('div', {className: 'chart'},
      h('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Bar chart ranking the 7 growing and 5 largest counties by ' + m.lab},
        rows.map((d, i) => {
          const yy = mt + i * rh, v = m.get(d), isSel = d.county === sel;
          return h('g', {key: d.county, className: 'pt', tabIndex: 0, role: 'button', 'aria-label': `${d.county}: ${m.fmt(v)}`, onClick: () => setSel(d.county),
              onKeyDown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setSel(d.county); } }},
            h('text', {x: ml - 8, y: yy + rh / 2 + 4, textAnchor: 'end', className: isSel ? 'lblb' : 'lbl'}, d.county),
            h('rect', {x: ml, y: yy + 4, width: Math.max(1, x(v) - ml), height: rh - 8, rx: 3, style: {fill: color(d.group), stroke: isSel ? 'var(--hl)' : 'none'}, strokeWidth: 2}),
            h('text', {x: x(v) + 6, y: yy + rh / 2 + 4}, m.fmt(v)));
        }),
        h('line', {x1: x(m.ref()), x2: x(m.ref()), y1: mt - 4, y2: H - 4, strokeDasharray: '5 4', style: {stroke: 'var(--hl)'}}),
        h('text', {x: x(m.ref()), y: mt - 8, textAnchor: 'middle'}, m.refLab + ' ' + m.fmt(m.ref()))
      ))
  );
}

/* ---------- Focal case ---------- */
function Focal({sel, setSel}){
  const rows = C.filter(d => d.county === 'Benton' || PEERS.includes(d.county)).sort((a, b) => b.ga - a.ga);
  const W = 560, H = 230, ml = 40, mr = 10, mt = 24, mb = 30, iw = W - ml - mr, ih = H - mt - mb;
  const bw = iw / rows.length, y = v => mt + (30 - v) / 30 * ih;
  return h('section', {className: 'card', id: 'focal'},
    h('h2', null, 'Focal case: Benton grew ' + byName.Benton.ga.toFixed(1) + '% vs ' + peerMed.toFixed(1) + '% for similar-size counties'),
    h('p', {className: 'note'}, 'Growth, Oct 2025 → Oct 2026, against five counties with 140,000–330,000 passenger cars. Benton also kept ' + pct(byName.Benton.aa / byName.Benton.ab, 0) + ' of its earlier additions.'),
    h('div', {className: 'chart'},
      h('svg', {viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': 'Bar chart of growth for Benton and five similar-size counties'},
        [0, 10, 20, 30].map(t => h('g', {key: t},
          h('line', {x1: ml, x2: W - mr, y1: y(t), y2: y(t), style: {stroke: 'var(--grid)'}}),
          h('text', {x: ml - 6, y: y(t) + 4, textAnchor: 'end'}, t + '%'))),
        rows.map((d, i) => {
          const isB = d.county === 'Benton', isSel = d.county === sel;
          return h('g', {key: d.county, className: 'pt', onClick: () => setSel(d.county)},
            h('rect', {x: ml + i * bw + bw * .18, y: y(d.ga), width: bw * .64, height: y(0) - y(d.ga), rx: 3, style: {fill: isB ? 'var(--c7)' : 'var(--other)', stroke: isSel ? 'var(--hl)' : 'none'}, strokeWidth: 2}),
            h('text', {x: ml + i * bw + bw / 2, y: y(d.ga) - 6, textAnchor: 'middle', className: isB ? 'lblb' : 'lbl'}, d.ga.toFixed(1) + '%'),
            h('text', {x: ml + i * bw + bw / 2, y: H - 10, textAnchor: 'middle', className: isB ? 'lblb' : 'lbl'}, d.county));
        }),
        h('line', {x1: ml, x2: W - mr, y1: y(peerMed), y2: y(peerMed), strokeDasharray: '5 4', style: {stroke: 'var(--hl)'}}),
        h('text', {x: W - mr, y: y(peerMed) - 6, textAnchor: 'end'}, 'peer median ' + peerMed.toFixed(1) + '%')
      ))
  );
}

function App(){
  const [sel, setSel] = useState('Benton');
  return h('main', {className: 'wrap'},
    h('header', {className: 'card'},
      h('h1', null, 'WA BEV Charging Review'),
      h('p', {className: 'lede'}, 'BEV additions halved after the federal credit ended: ' + fmt(before) + ' → ' + fmt(after) + ' a month.'),
      h('p', {className: 'cta'}, 'By ', h('b', null, 'Feb 28, 2027'), ': survey charging access in the 7 growing counties, and charger capacity in the 5 largest.'),
      h('div', {className: 'meta'}, h('span', null, 'Data: WA DOL, downloaded 2026-11-19'), h('span', null, 'Not in the data: chargers, usage, home charging'), h('span', null, 'Jinseong Park · DA321'))),
    h(Kpis),
    h(Trend),
    h('div', {className: 'two'}, h(Scatter, {sel, setSel}), h(Ranking, {sel, setSel}))
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(h(App));
})();
</script>
